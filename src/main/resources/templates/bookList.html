<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список книг</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>
<h1>Список книг</h1>

<p class="empty" th:if="${#lists.isEmpty(books)}">
    Книг пока нет.
</p>

<table th:unless="${#lists.isEmpty(books)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Автор</th>
        <th>Жанр</th>
        <th>Год издания</th>
        <th>Доступна</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Название</td>
        <td th:text="${book.author.firstName + ' ' + book.author.lastName}">Автор</td>
        <td th:text="${book.genre.name}">Жанр</td>
        <td th:text="${book.publicationYear}">2024</td>
        <td th:text="${book.available} ? 'Да' : 'Нет'">Да</td>
    </tr>
    </tbody>
</table>

</body>
</html>
