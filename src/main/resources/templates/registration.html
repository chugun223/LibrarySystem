<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
<h1>Регистрация</h1>

<div th:if="${message}">
    <p th:text="${message}" style="color: red"></p>
</div>

<form th:action="@{/registration}" th:object="${registrationDto}" method="post">
    <div>
        <label>Имя: <input type="text" th:field="*{firstName}" required/></label>
    </div>
    <div>
        <label>Фамилия: <input type="text" th:field="*{lastName}" required/></label>
    </div>
    <div>
        <label>Email: <input type="email" th:field="*{email}" required/></label>
    </div>
    <div>
        <label>Телефон: <input type="text" th:field="*{phoneNumber}" required/></label>
    </div>
    <div>
        <label>Пароль: <input type="password" th:field="*{password}" required/></label>
    </div>
    <div>
        <input type="submit" value="Зарегистрироваться"/>
    </div>
</form>

<p><a th:href="@{/login}">У меня уже есть аккаунт</a></p>
</body>
</html>
